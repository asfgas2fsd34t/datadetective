<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataDetective / Investigation Experience Prototype</title>
  <style>
    :root {
      --ink: #172126;
      --muted: #68777b;
      --line: #d8e1dd;
      --paper: #f6f8f5;
      --white: #ffffff;
      --green: #0b6e5b;
      --green-soft: #dff1e9;
      --blue: #2563a6;
      --blue-soft: #e5effa;
      --amber: #a96712;
      --amber-soft: #fff0d8;
      --coral: #b84c43;
      --coral-soft: #fbe7e4;
      --shadow: 0 16px 42px rgba(23, 33, 38, 0.08);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #83b9e8; outline-offset: 2px; }
    .shell { min-height: 100vh; }
    .topbar {
      align-items: center;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 20px;
      justify-content: space-between;
      padding: 15px clamp(18px, 4vw, 54px);
      position: sticky;
      top: 0;
      z-index: 4;
    }
    .brand { align-items: center; display: flex; gap: 11px; }
    .brand-mark {
      align-items: center;
      background: var(--ink);
      color: #fff;
      display: grid;
      font-size: 13px;
      font-weight: 800;
      height: 30px;
      letter-spacing: .08em;
      place-items: center;
      width: 30px;
    }
    .brand-name { font-size: 13px; font-weight: 800; letter-spacing: .18em; }
    .top-meta { align-items: center; color: var(--muted); display: flex; font-size: 12px; gap: 12px; }
    .status-dot { background: var(--green); border-radius: 50%; display: inline-block; height: 7px; width: 7px; }
    .prototype-stamp { border: 1px solid #e6caa4; color: var(--amber); font-size: 10px; font-weight: 800; letter-spacing: .14em; padding: 6px 8px; }
    .main { margin: 0 auto; max-width: 1460px; padding: 34px clamp(18px, 4vw, 54px) 120px; }
    .intake { margin: 4vh auto 0; max-width: 1060px; }
    .intake h1 { max-width: 720px; }
    .intake-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); margin-top: 28px; }
    .intake-panel { background: var(--white); border: 1px solid var(--line); box-shadow: var(--shadow); padding: clamp(20px, 4vw, 35px); }
    .question-label { color: var(--ink); display: block; font-size: 13px; font-weight: 800; margin-bottom: 10px; }
    .question-input { border: 1px solid #aebdb8; color: var(--ink); display: block; font: inherit; font-size: 17px; line-height: 1.55; min-height: 128px; padding: 14px; resize: vertical; width: 100%; }
    .question-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); outline: 0; }
    .input-hint { color: var(--muted); font-size: 11px; line-height: 1.55; margin: 9px 0 20px; }
    .source-list { display: grid; gap: 10px; margin-top: 16px; }
    .source-row { align-items: center; border: 1px solid var(--line); display: flex; gap: 11px; justify-content: space-between; padding: 11px 12px; }
    .source-main { align-items: center; display: flex; gap: 10px; min-width: 0; }
    .source-icon { align-items: center; background: var(--blue-soft); color: var(--blue); display: grid; flex: 0 0 auto; font-size: 11px; font-weight: 800; height: 27px; place-items: center; width: 27px; }
    .source-main strong { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source-main small { color: var(--muted); display: block; font-size: 10px; margin-top: 3px; }
    .file-input { display: none; }
    .file-label { align-items: center; border: 1px dashed #9fb4ac; color: var(--green); cursor: pointer; display: flex; font-size: 11px; font-weight: 750; justify-content: center; min-height: 43px; padding: 8px; text-align: center; }
    .file-label:hover { background: var(--green-soft); }
    .guardrail-list { display: grid; gap: 12px; margin: 0; padding: 0; }
    .guardrail-list li { align-items: start; display: grid; font-size: 12px; gap: 9px; grid-template-columns: 20px 1fr; line-height: 1.5; list-style: none; }
    .guardrail-list li::before { color: var(--green); content: "✓"; font-weight: 900; }
    .intake-actions { align-items: center; display: flex; gap: 12px; justify-content: space-between; margin-top: 22px; }
    .intake-actions .tiny { margin: 0; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .17em; margin: 0 0 10px; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(26px, 3.4vw, 46px); letter-spacing: -.04em; line-height: 1.04; margin-bottom: 12px; max-width: 780px; }
    h2 { font-size: 19px; letter-spacing: -.02em; margin-bottom: 10px; }
    h3 { font-size: 14px; margin-bottom: 7px; }
    .subline { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 0; max-width: 720px; }
    .hero-row { align-items: end; display: flex; gap: 24px; justify-content: space-between; margin-bottom: 26px; }
    .hero-actions { align-items: center; display: flex; flex-wrap: wrap; gap: 9px; justify-content: end; }
    .btn { align-items: center; border: 1px solid transparent; cursor: pointer; display: inline-flex; font-size: 12px; font-weight: 750; gap: 8px; justify-content: center; min-height: 38px; padding: 0 13px; transition: .15s ease; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: #095947; }
    .btn-secondary { background: var(--white); border-color: var(--line); color: var(--ink); }
    .btn-secondary:hover { border-color: #9fb8ae; }
    .btn-quiet { background: transparent; border-color: transparent; color: var(--muted); padding: 0 6px; }
    .btn-quiet:hover { color: var(--ink); }
    .btn[disabled] { cursor: wait; opacity: .6; transform: none; }
    .metric-strip { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 24px; }
    .metric-chip { background: var(--white); border: 1px solid var(--line); min-width: 145px; padding: 12px 14px; }
    .metric-chip small { color: var(--muted); display: block; font-size: 10px; font-weight: 750; letter-spacing: .1em; margin-bottom: 7px; text-transform: uppercase; }
    .metric-chip strong { display: block; font-size: 21px; letter-spacing: -.04em; }
    .metric-chip .negative { color: var(--coral); }
    .metric-chip .positive { color: var(--green); }
    .metric-chip .neutral { color: var(--blue); }
    .panel { background: var(--white); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .panel-head { align-items: baseline; border-bottom: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; padding: 16px 18px; }
    .panel-head h2, .panel-head h3 { margin: 0; }
    .panel-note { color: var(--muted); font-size: 11px; }
    .panel-body { padding: 17px 18px; }
    .tag { align-items: center; display: inline-flex; font-size: 10px; font-weight: 800; gap: 5px; letter-spacing: .08em; padding: 5px 7px; text-transform: uppercase; }
    .tag-green { background: var(--green-soft); color: var(--green); }
    .tag-blue { background: var(--blue-soft); color: var(--blue); }
    .tag-amber { background: var(--amber-soft); color: var(--amber); }
    .tag-coral { background: var(--coral-soft); color: var(--coral); }
    .muted { color: var(--muted); }
    .tiny { color: var(--muted); font-size: 11px; line-height: 1.55; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    .state-line { align-items: center; background: #eef5f1; border-left: 3px solid var(--green); color: #315b4f; display: flex; font-size: 12px; gap: 8px; margin-bottom: 20px; padding: 10px 13px; }
    .state-line.running { background: var(--amber-soft); border-color: var(--amber); color: #765015; }
    .state-line.complete { background: var(--green-soft); }
    .layout-a { display: grid; gap: 15px; grid-template-columns: 270px minmax(360px, 1fr) 330px; }
    .hypothesis-list { display: grid; gap: 7px; padding: 12px; }
    .hypothesis-item { background: #fbfcfb; border: 1px solid transparent; cursor: pointer; padding: 13px 12px; text-align: left; width: 100%; }
    .hypothesis-item:hover { border-color: #afc8bd; }
    .hypothesis-item.selected { background: #eef8f3; border-color: #7bb29e; }
    .hypothesis-item .item-top { align-items: center; display: flex; justify-content: space-between; margin-bottom: 8px; }
    .hypothesis-id { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; }
    .hypothesis-item strong { display: block; font-size: 13px; line-height: 1.35; }
    .hypothesis-item p { color: var(--muted); font-size: 11px; line-height: 1.45; margin: 7px 0 0; }
    .evidence-stack { display: grid; gap: 12px; }
    .evidence-card { border: 1px solid var(--line); padding: 15px; }
    .evidence-card.selected { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); }
    .evidence-top { align-items: start; display: flex; gap: 12px; justify-content: space-between; }
    .evidence-index { align-items: center; background: var(--blue-soft); color: var(--blue); display: grid; flex: 0 0 auto; font-size: 11px; font-weight: 800; height: 27px; place-items: center; width: 27px; }
    .evidence-card h3 { line-height: 1.4; margin: 0; }
    .evidence-card p { color: var(--muted); font-size: 12px; line-height: 1.55; margin: 9px 0 12px; }
    .evidence-footer { align-items: center; border-top: 1px solid #edf1ee; display: flex; justify-content: space-between; padding-top: 10px; }
    .trace-link { background: none; border: 0; color: var(--blue); cursor: pointer; font-size: 11px; font-weight: 750; padding: 0; }
    .finding { border-left: 3px solid var(--green); margin-bottom: 15px; padding-left: 13px; }
    .finding:last-child { margin-bottom: 0; }
    .finding p { font-size: 13px; line-height: 1.58; margin-bottom: 8px; }
    .finding .tiny { margin: 0; }
    .uncertainty { background: var(--amber-soft); color: #765015; font-size: 11px; line-height: 1.5; padding: 10px 11px; }
    .activity { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 14px; }
    .activity-row { align-items: baseline; display: flex; font-size: 11px; gap: 9px; line-height: 1.6; padding: 4px 0; }
    .activity-row time { color: var(--muted); flex: 0 0 42px; font-family: monospace; }

    .layout-b { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 310px; }
    .b-workspace { display: grid; gap: 15px; grid-template-columns: 280px minmax(390px, 1fr) 285px; }
    .chat-panel { display: flex; flex-direction: column; min-height: 690px; }
    .chat-thread { display: flex; flex: 1; flex-direction: column; gap: 12px; max-height: 500px; overflow: auto; padding: 16px; }
    .chat-message { display: flex; gap: 8px; line-height: 1.5; max-width: 94%; }
    .chat-message.user { align-self: end; flex-direction: row-reverse; }
    .chat-avatar { align-items: center; background: var(--ink); color: #fff; display: grid; flex: 0 0 auto; font-size: 10px; font-weight: 800; height: 25px; place-items: center; width: 25px; }
    .chat-message.user .chat-avatar { background: var(--blue); }
    .chat-bubble { background: #f1f5f2; font-size: 11px; padding: 9px 10px; }
    .chat-message.user .chat-bubble { background: var(--blue-soft); }
    .chat-bubble strong { display: block; font-size: 10px; letter-spacing: .08em; margin-bottom: 4px; text-transform: uppercase; }
    .chat-suggestions { border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 0; }
    .suggestion { background: var(--white); border: 1px solid #a8c5b8; color: var(--green); cursor: pointer; font-size: 10px; line-height: 1.35; padding: 7px 8px; text-align: left; }
    .suggestion:hover { background: var(--green-soft); }
    .chat-compose { border-top: 1px solid var(--line); padding: 13px 14px 15px; }
    .chat-compose textarea { border: 1px solid #b2c0bc; display: block; font: inherit; font-size: 12px; line-height: 1.45; min-height: 70px; padding: 9px; resize: vertical; width: 100%; }
    .chat-compose textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); outline: 0; }
    .chat-compose-footer { align-items: center; display: flex; justify-content: space-between; margin-top: 8px; }
    .live-graph-panel { min-height: 690px; overflow: hidden; }
    .live-graph { display: flex; flex-direction: column; gap: 9px; max-height: 640px; overflow: auto; padding: 19px; }
    .graph-viewport { background-color: #f8faf8; background-image: linear-gradient(#e8efeb 1px, transparent 1px), linear-gradient(90deg, #e8efeb 1px, transparent 1px); background-size: 28px 28px; cursor: grab; height: 638px; overflow: hidden; position: relative; touch-action: none; }
    .graph-viewport.is-panning { cursor: grabbing; }
    .graph-world { height: 980px; position: absolute; transform-origin: 0 0; width: 1380px; }
    .graph-world .graph-node { position: absolute; width: 245px; z-index: 2; }
    .graph-world .graph-node:hover { z-index: 3; }
    .graph-world .graph-node h3 { max-width: 172px; }
    .graph-edges { height: 980px; left: 0; overflow: visible; pointer-events: none; position: absolute; top: 0; width: 1380px; z-index: 1; }
    .graph-edge { fill: none; stroke: #9caea8; stroke-width: 2; }
    .graph-edge.supports, .graph-edge.qualifies { stroke: var(--green); }
    .graph-edge.weakens { stroke: var(--coral); stroke-dasharray: 7 5; }
    .graph-edge.suggests, .graph-edge.narrows { stroke: var(--amber); stroke-dasharray: 4 4; }
    .graph-edge-label { fill: #6e7d7a; font-size: 11px; font-weight: 700; }
    .canvas-tools { align-items: center; display: flex; gap: 5px; }
    .canvas-tool { align-items: center; background: var(--white); border: 1px solid var(--line); color: var(--ink); cursor: pointer; display: grid; font-size: 13px; height: 28px; place-items: center; width: 28px; }
    .canvas-tool:hover { background: var(--green-soft); border-color: #8fb8a8; }
    .graph-node { background: var(--white); border: 1px solid var(--line); padding: 13px 14px; position: relative; transition: .25s ease; }
    .graph-node.is-new { animation: nodeIn .3s ease both; }
    .graph-node.anomaly { border-left: 4px solid var(--coral); }
    .graph-node.hypothesis { border-left: 4px solid var(--amber); cursor: pointer; }
    .graph-node.hypothesis:hover, .graph-node.hypothesis.selected { background: #fffaf2; border-color: #d3a25d; }
    .graph-node.evidence { border-left: 4px solid var(--blue); }
    .graph-node.finding { border-left: 4px solid var(--green); }
    .graph-node.scope { border-left: 4px solid #7656a8; }
    .graph-node.running { box-shadow: 0 0 0 2px #f0d59e; }
    .graph-node.pending { opacity: .55; }
    .graph-node-top { align-items: center; display: flex; gap: 8px; justify-content: space-between; }
    .graph-node h3 { font-size: 13px; line-height: 1.4; margin: 0; }
    .graph-node p { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 7px 0 0; }
    .graph-meta { color: var(--muted); font-family: monospace; font-size: 10px; margin-top: 10px; }
    .graph-arrow { color: #9aaba7; font-size: 17px; height: 13px; line-height: 13px; text-align: center; }
    .graph-branches { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .graph-branches .graph-node { min-height: 115px; }
    .graph-empty { border: 1px dashed #aabbb4; color: var(--muted); font-size: 12px; line-height: 1.55; padding: 18px; text-align: center; }
    .graph-detail { min-height: 690px; }
    .detail-stack { display: grid; gap: 13px; padding: 17px; }
    .detail-block { border-bottom: 1px solid #edf1ee; padding-bottom: 13px; }
    .detail-block:last-child { border-bottom: 0; padding-bottom: 0; }
    .detail-block small { color: var(--muted); display: block; font-size: 10px; font-weight: 800; letter-spacing: .1em; margin-bottom: 6px; text-transform: uppercase; }
    .detail-block strong { display: block; font-size: 13px; line-height: 1.45; }
    .detail-block p { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 5px 0 0; }
    @keyframes nodeIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .canvas-panel { min-height: 610px; overflow: hidden; position: relative; }
    .canvas-head { align-items: center; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; padding: 17px 20px; }
    .canvas-head h2 { margin: 0; }
    .canvas { align-items: center; display: flex; flex-direction: column; gap: 13px; padding: 30px 20px 38px; }
    .flow-node { background: var(--white); border: 1px solid var(--line); max-width: 430px; padding: 15px 17px; width: 100%; }
    .flow-node.anomaly { border-top: 4px solid var(--coral); }
    .flow-node.hypothesis { border-top: 4px solid var(--amber); cursor: pointer; }
    .flow-node.hypothesis:hover, .flow-node.hypothesis.active { background: #fffaf2; border-color: #d5a45e; }
    .flow-node.evidence { border-top: 4px solid var(--blue); }
    .flow-node.finding { border-left: 0; border-top: 4px solid var(--green); margin: 0; padding-left: 17px; }
    .flow-label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; margin-bottom: 7px; text-transform: uppercase; }
    .flow-node strong { display: block; font-size: 15px; line-height: 1.4; }
    .flow-node p { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 7px 0 0; }
    .flow-arrow { color: #9aaba7; font-size: 20px; height: 18px; line-height: 18px; }
    .branch-row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; max-width: 650px; width: 100%; }
    .branch-row .flow-node { max-width: none; }
    .side-stack { display: grid; gap: 16px; align-content: start; }
    .decision-list { display: grid; gap: 9px; }
    .decision-row { align-items: start; border-bottom: 1px solid #edf1ee; display: grid; gap: 10px; grid-template-columns: 25px 1fr; padding-bottom: 10px; }
    .decision-row:last-child { border: 0; padding-bottom: 0; }
    .decision-icon { align-items: center; display: grid; font-size: 12px; font-weight: 800; height: 22px; place-items: center; width: 22px; }
    .decision-icon.support { background: var(--green-soft); color: var(--green); }
    .decision-icon.reject { background: var(--coral-soft); color: var(--coral); }
    .decision-icon.open { background: var(--amber-soft); color: var(--amber); }
    .decision-row strong { display: block; font-size: 12px; line-height: 1.4; }
    .decision-row p { color: var(--muted); font-size: 11px; line-height: 1.45; margin: 4px 0 0; }
    .trace-table { border-collapse: collapse; font-size: 11px; width: 100%; }
    .trace-table td { border-bottom: 1px solid #edf1ee; padding: 8px 0; vertical-align: top; }
    .trace-table td:first-child { color: var(--muted); padding-right: 8px; width: 35%; }

    .layout-c { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.25fr) minmax(290px, .75fr); }
    .brief { padding: clamp(22px, 4vw, 48px); }
    .brief-kicker { align-items: center; display: flex; gap: 10px; margin-bottom: 26px; }
    .brief h1 { font-size: clamp(30px, 4.4vw, 57px); max-width: 820px; }
    .brief-lead { color: #405056; font-size: 18px; line-height: 1.55; max-width: 710px; }
    .brief-rule { border: 0; border-top: 1px solid var(--line); margin: 31px 0; }
    .brief-section { max-width: 850px; }
    .brief-section h2 { align-items: center; display: flex; gap: 10px; }
    .number { color: var(--green); font-family: monospace; font-size: 12px; }
    .hypothesis-table { border-top: 1px solid var(--line); margin-top: 12px; }
    .hypothesis-line { align-items: center; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 12px; grid-template-columns: 22px minmax(150px, 1fr) 110px 78px; padding: 13px 0; }
    .hypothesis-line:hover { background: #fbfcfb; }
    .hypothesis-line .rank { color: var(--muted); font-family: monospace; font-size: 12px; }
    .hypothesis-line strong { font-size: 13px; }
    .bar { background: #e8eeea; height: 6px; overflow: hidden; }
    .bar i { background: var(--green); display: block; height: 100%; }
    .confidence { color: var(--green); font-size: 11px; font-weight: 800; text-align: right; }
    .brief-footer { align-items: start; display: grid; gap: 22px; grid-template-columns: 1fr 1fr; }
    .proof-box { background: #f2f7f4; border-left: 3px solid var(--green); padding: 14px 15px; }
    .proof-box strong { display: block; font-size: 12px; margin-bottom: 6px; }
    .proof-box p { color: #496158; font-size: 12px; line-height: 1.5; margin: 0; }
    .sidebar-c { display: grid; gap: 16px; align-content: start; }
    .sidebar-c .panel { box-shadow: none; }
    .fact-list { display: grid; gap: 11px; }
    .fact { border-bottom: 1px solid #edf1ee; padding-bottom: 10px; }
    .fact:last-child { border-bottom: 0; padding-bottom: 0; }
    .fact small { color: var(--muted); display: block; font-size: 10px; font-weight: 800; letter-spacing: .1em; margin-bottom: 5px; text-transform: uppercase; }
    .fact strong { font-size: 14px; line-height: 1.45; }
    .fact p { color: var(--muted); font-size: 11px; line-height: 1.45; margin: 4px 0 0; }

    .switcher { align-items: center; background: var(--ink); bottom: 18px; box-shadow: 0 12px 28px rgba(23, 33, 38, .22); color: #fff; display: flex; gap: 8px; left: 50%; padding: 7px 8px; position: fixed; transform: translateX(-50%); z-index: 10; }
    .switcher button { align-items: center; background: transparent; border: 0; color: #c9d8d2; cursor: pointer; display: grid; height: 30px; place-items: center; width: 30px; }
    .switcher button:hover { background: #33434a; color: #fff; }
    .switcher-label { border-left: 1px solid #45555b; border-right: 1px solid #45555b; font-size: 11px; min-width: 180px; padding: 0 13px; text-align: center; }
    .switcher-label strong { color: #fff; }
    .toast { background: var(--ink); bottom: 78px; color: #fff; font-size: 12px; left: 50%; opacity: 0; padding: 10px 13px; pointer-events: none; position: fixed; transform: translate(-50%, 8px); transition: .2s ease; z-index: 9; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .clarify-box { background: var(--blue-soft); border-left: 3px solid var(--blue); color: #315678; font-size: 12px; line-height: 1.55; margin-top: 14px; padding: 11px 13px; }

    @media (max-width: 1120px) {
      .layout-a { grid-template-columns: 235px minmax(0, 1fr); }
      .layout-a > .panel:last-child { grid-column: 1 / -1; }
      .b-workspace { grid-template-columns: 260px minmax(0, 1fr); }
      .b-workspace > .graph-detail { grid-column: 1 / -1; min-height: 0; }
      .layout-c { grid-template-columns: 1fr; }
      .sidebar-c { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 760px) {
      .topbar { align-items: start; }
      .top-meta { align-items: end; flex-direction: column; gap: 5px; }
      .hero-row { align-items: start; flex-direction: column; }
      .hero-actions { justify-content: start; }
      .layout-a, .layout-b { grid-template-columns: 1fr; }
      .b-workspace { grid-template-columns: 1fr; }
      .b-workspace > .graph-detail { grid-column: auto; }
      .chat-panel, .live-graph-panel, .graph-detail { min-height: 0; }
      .graph-branches { grid-template-columns: 1fr; }
      .intake-grid { grid-template-columns: 1fr; }
      .layout-a > .panel:last-child { grid-column: auto; }
      .layout-b .canvas-panel { min-height: 0; }
      .sidebar-c { grid-template-columns: 1fr; }
      .brief-footer { grid-template-columns: 1fr; }
      .hypothesis-line { grid-template-columns: 22px minmax(0, 1fr) 72px; }
      .hypothesis-line .bar { display: none; }
      .switcher-label { min-width: 150px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">D</span><span class="brand-name">DATADETECTIVE</span></div>
      <div class="top-meta"><span><i class="status-dot"></i> READ-ONLY WORKSPACE</span><span class="prototype-stamp">PROTOTYPE / THROWAWAY</span></div>
    </header>
    <main id="app" class="main"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <nav class="switcher" aria-label="Prototype variants">
      <button type="button" data-switch="previous" title="Previous variant" aria-label="Previous variant">←</button>
      <div class="switcher-label"><strong id="variant-key">A</strong> <span id="variant-name">Evidence ledger</span></div>
      <button type="button" data-switch="next" title="Next variant" aria-label="Next variant">→</button>
    </nav>
  </div>
  <script>
    // Prototype question: which investigation surface makes evidence and uncertainty easiest to judge?
    const variants = [
      { key: "A", name: "Evidence ledger" },
      { key: "B", name: "Investigation canvas" },
      { key: "C", name: "Decision brief" }
    ];
    const hypothesisData = [
      { id: "H1", title: "渠道流量减少", detail: "Direct traffic fell on mobile", status: "weakened", confidence: 22, color: "coral" },
      { id: "H2", title: "移动端结算转化下降", detail: "Checkout completion fell after cart", status: "supported", confidence: 86, color: "green" },
      { id: "H3", title: "商品结构向低价倾斜", detail: "More low-price items were purchased", status: "open", confidence: 58, color: "amber" }
    ];
    const defaultQuestion = "为什么最近 7 天 GMV 下降了 18.4%？";
    function initialGraph() {
      return {
        nodes: [{ id: "anomaly", kind: "anomaly", status: "observed", x: 70, y: 300, label: "异常 / GMV -18.4%", detail: "最近 7 天 vs 前一周 · 已支付订单金额", meta: "observed · source: orders.sqlite" }],
        edges: []
      };
    }
    let state = {
      screen: "intake",
      phase: "ready",
      question: "",
      fileName: "",
      selected: "H2",
      clarified: false,
      messages: [],
      graph: initialGraph(),
      view: { x: 28, y: 18, scale: .78 },
      events: ["等待开始调查"]
    };

    function currentVariant() {
      const raw = new URLSearchParams(location.search).get("variant") || "A";
      return variants.some(item => item.key === raw) ? raw : "A";
    }

    function setVariant(key) {
      const url = new URL(location.href);
      url.searchParams.set("variant", key);
      history.replaceState({}, "", url);
      render();
    }

    function cycleVariant(direction) {
      const index = variants.findIndex(item => item.key === currentVariant());
      const next = (index + direction + variants.length) % variants.length;
      setVariant(variants[next].key);
    }

    function notify(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(window.__toastTimer);
      window.__toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function pushMessage(role, text) {
      state.messages.push({ role, text });
    }

    function clearRunTimers() {
      (window.__runTimers || []).forEach(timer => window.clearTimeout(timer));
      window.__runTimers = [];
    }

    function addGraph(nodes, edges = []) {
      state.graph.nodes.push(...nodes);
      state.graph.edges.push(...edges);
    }

    function updateGraph(id, updates) {
      const node = state.graph.nodes.find(item => item.id === id);
      if (node) Object.assign(node, updates);
    }

    function startTimedSteps(steps) {
      clearRunTimers();
      window.__runTimers = steps.map(step => window.setTimeout(() => {
        step.run();
        render();
      }, step.delay));
    }

    function beginInvestigation() {
      state.phase = "running";
      pushMessage("agent", "计划已确认。我会边执行边更新调查图；如果你改变范围，可以随时追问。\n\n现在先检查渠道、设备和结算漏斗。 ");
      state.events.unshift("开始执行调查计划");
      render();
      startTimedSteps([
        { delay: 420, run: true },
        { delay: 1100, run: true },
        { delay: 1780, run: true },
        { delay: 2460, run: true }
      ].map(step => ({ delay: step.delay, run: () => {
        const index = [420, 1100, 1780, 2460].indexOf(step.delay);
        if (index === 0) {
          if (!state.graph.nodes.some(item => item.id === "h1")) addGraph([
            { id: "h1", kind: "hypothesis", status: "testing", x: 380, y: 110, label: "H1 / 渠道流量减少", detail: "验证渠道 sessions 是否能解释 GMV 变化", meta: "pending evidence" },
            { id: "h2", kind: "hypothesis", status: "testing", x: 380, y: 300, label: "H2 / Android 转化下降", detail: "验证 cart → paid 是否在设备维度恶化", meta: "pending evidence" },
            { id: "h3", kind: "hypothesis", status: "testing", x: 380, y: 490, label: "H3 / 商品结构变化", detail: "验证低价商品占比是否改变客单价", meta: "pending evidence" }
          ], [
            { from: "anomaly", to: "h1", relation: "tests" },
            { from: "anomaly", to: "h2", relation: "tests" },
            { from: "anomaly", to: "h3", relation: "tests" }
          ]);
          ["h1", "h2", "h3"].forEach(id => updateGraph(id, { status: "testing", meta: "testing now" }));
          state.events.unshift("已生成 3 个可证伪 Hypotheses");
          pushMessage("agent", "我先提出 3 个假设。接下来每个假设都必须连到实际执行的 Evidence。 ");
        }
        if (index === 1) {
          addGraph([{ id: "e1", kind: "evidence", status: "complete", x: 720, y: 300, label: "E1 / Android checkout → paid -31%", detail: "移动端结算漏斗在比较窗口显著下降，桌面端稳定。", meta: "query:funnel_07 · replayable" }], [{ from: "h2", to: "e1", relation: "supports" }]);
          updateGraph("h2", { status: "supported", detail: "E1 支持 Android 结算转化下降", meta: "supported by E1" });
          addGraph([{ id: "h2a", kind: "hypothesis", status: "open", x: 1010, y: 390, label: "H2.1 / 支付渠道失败", detail: "新线索：需要支付错误日志才能继续判断", meta: "new branch from E1" }], [{ from: "e1", to: "h2a", relation: "suggests" }]);
          state.selected = "h2";
          state.events.unshift("E1 完成：H2 得到支持，并产生新分支 H2.1");
          pushMessage("agent", "E1 支持 H2。我发现一个新线索：可能是支付渠道失败，但当前订单数据还不能证明，需要支付错误日志。 ");
        }
        if (index === 2) {
          addGraph([{ id: "e2", kind: "evidence", status: "complete", x: 720, y: 110, label: "E2 / 渠道流量贡献不足", detail: "mobile_direct sessions 仅下降 4.2%，不足以解释 GMV 下跌。", meta: "query:channel_delta_03 · replayable" }], [{ from: "h1", to: "e2", relation: "weakens" }]);
          updateGraph("h1", { status: "weakened", detail: "E2 显示流量变化不是主要贡献项", meta: "weakened by E2" });
          state.events.unshift("E2 完成：H1 被削弱");
          pushMessage("agent", "E2 削弱了 H1。它仍保留在调查图中，但不会进入当前主要 Finding。 ");
        }
        if (index === 3) {
          addGraph([{ id: "e3", kind: "evidence", status: "complete", x: 720, y: 490, label: "E3 / AOV +3.1%", detail: "客单价上升，低价商品结构变化不是主要解释。", meta: "query:aov_mix_11 · replayable" }, { id: "f1", kind: "finding", status: "complete", x: 1010, y: 190, label: "F1 / Android 转化是主要贡献因素", detail: "当前证据支持贡献关系，但不能证明具体因果事件。", meta: "supported by E1 · qualified" }], [{ from: "h3", to: "e3", relation: "weakens" }, { from: "h2", to: "f1", relation: "supports" }, { from: "e1", to: "f1", relation: "qualifies" }]);
          updateGraph("h3", { status: "weakened", detail: "E3 方向与低价结构主因不一致", meta: "weakened by E3" });
          state.phase = "complete";
          state.events.unshift("调查完成：3 个 Evidence、1 个 Finding、1 个开放分支");
          pushMessage("agent", "调查完成。当前最有证据支持的是 H2，但 H2.1 仍需支付错误日志验证。你可以继续追问或补充数据。 ");
          notify("调查图已更新：Finding 已绑定 Evidence");
        }
      }})));
    }

    function sendChat(textOverride) {
      const input = document.getElementById("chat-input");
      const text = (textOverride || input?.value || "").trim();
      if (!text) {
        input?.focus();
        return;
      }
      pushMessage("user", text);
      if (input) input.value = "";

      if (state.phase === "clarifying") {
        state.phase = "plan_review";
        state.events.unshift("用户补充了指标定义，生成调查计划");
        pushMessage("agent", "收到。我会按“已支付订单金额、排除取消订单、对比前 7 天”处理。\n\n调查计划：渠道流量、设备转化、商品结构。确认后我开始执行。 ");
        addGraph([
          { id: "h1", kind: "hypothesis", status: "planned", x: 380, y: 110, label: "H1 / 渠道流量减少", detail: "验证渠道 sessions 是否能解释 GMV 变化", meta: "planned" },
          { id: "h2", kind: "hypothesis", status: "planned", x: 380, y: 300, label: "H2 / Android 转化下降", detail: "验证 cart → paid 是否在设备维度恶化", meta: "planned" },
          { id: "h3", kind: "hypothesis", status: "planned", x: 380, y: 490, label: "H3 / 商品结构变化", detail: "验证低价商品占比是否改变客单价", meta: "planned" }
        ], [{ from: "anomaly", to: "h1", relation: "tests" }, { from: "anomaly", to: "h2", relation: "tests" }, { from: "anomaly", to: "h3", relation: "tests" }]);
        render();
        return;
      }

      if (state.phase === "complete") {
        state.phase = "follow_up";
        state.events.unshift("收到追问，创建新的调查范围");
        const scopeId = "scope-" + Date.now();
        addGraph([{ id: scopeId, kind: "scope", status: "running", x: 70, y: 730, label: "追问 / " + text, detail: "在原调查基础上增加新的过滤条件或证据需求", meta: "follow-up running" }]);
        pushMessage("agent", "收到追问。我会保留原调查结果，并在新的范围下追加 Evidence，不会覆盖已有证据。 ");
        render();
        window.setTimeout(() => {
          const scope = state.graph.nodes.find(item => item.kind === "scope" && item.status === "running");
          if (scope) Object.assign(scope, { status: "complete", meta: "scope confirmed" });
          addGraph([{ id: "h-follow-up", kind: "hypothesis", status: "supported", x: 380, y: 730, label: "H4 / 追问范围假设", detail: "在新增范围下验证原结论是否成立", meta: "follow-up hypothesis" }, { id: "e-follow-up", kind: "evidence", status: "complete", x: 720, y: 730, label: "E8 / 追问范围 Evidence", detail: "新增范围下的分群结果已生成，可与原 Evidence 对比。", meta: "query:follow_up_01 · replayable" }], [{ from: scopeId, to: "h-follow-up", relation: "narrows" }, { from: "h-follow-up", to: "e-follow-up", relation: "supports" }]);
          state.phase = "complete";
          state.events.unshift("追问完成：新增 E8，原调查链路保留");
          pushMessage("agent", "追问完成。新的 Evidence 已加入调查图，原来的 H1/H2/H3 和 F1 仍然可查看。 ");
          render();
        }, 760);
        return;
      }

      pushMessage("agent", "我会先完成当前调查阶段，再处理这条追问。你也可以先确认当前调查计划。 ");
      render();
    }

    function action(action, id) {
      if (action === "start") {
        const input = document.getElementById("question-input");
        const question = input?.value.trim();
        if (!question) {
          notify("请先输入你想调查的问题");
          input?.focus();
          return;
        }
        state.screen = "workspace";
        state.phase = "clarifying";
        state.question = question;
        state.messages = [
          { role: "user", text: question },
          { role: "agent", text: "在开始调查前，我需要确认 Metric 定义、对比窗口和数据范围。你可以直接回答，也可以继续追问。" }
        ];
        state.graph = initialGraph();
        state.events = ["问题已提交，等待指标定义确认"];
        render();
        notify("Agent 正在澄清调查问题");
        return;
      }
      if (action === "run" || action === "confirm-plan") {
        if (state.phase === "plan_review") beginInvestigation();
        return;
      }
      if (action === "send-chat") {
        sendChat();
        return;
      }
      if (action === "suggestion") {
        sendChat(id);
        return;
      }
      if (action === "zoom-in" || action === "zoom-out") {
        state.view.scale = Math.min(1.35, Math.max(.45, state.view.scale + (action === "zoom-in" ? .1 : -.1)));
        render();
        return;
      }
      if (action === "fit-graph") {
        state.view = { x: 28, y: 18, scale: .78 };
        render();
        return;
      }
      if (action === "reset") {
        clearRunTimers();
        state = { screen: "intake", phase: "ready", question: "", fileName: "", selected: "H2", clarified: false, messages: [], graph: initialGraph(), view: { x: 28, y: 18, scale: .78 }, events: ["等待开始调查"] };
        render();
        notify("已回到新的调查");
        return;
      }
      if (action === "hypothesis") {
        state.selected = id;
        state.events.unshift("查看 " + id + " 的证据链");
        render();
        return;
      }
      if (action === "clarify") {
        state.clarified = !state.clarified;
        state.events.unshift(state.clarified ? "用户确认：GMV = 已支付订单金额" : "收起指标定义确认");
        render();
        return;
      }
      if (action === "trace") {
        state.events.unshift("打开 Evidence E-02：移动端结算漏斗 SQL");
        render();
        notify("Evidence E-02 已定位");
      }
    }

    function bindActions() {
      document.querySelectorAll("[data-action]").forEach(element => {
        element.addEventListener("click", () => action(element.dataset.action, element.dataset.id || element.dataset.text));
      });
      const fileInput = document.getElementById("data-file");
      if (fileInput) {
        fileInput.addEventListener("change", () => {
          state.fileName = fileInput.files[0]?.name || "";
          render();
          if (state.fileName) notify("已选择数据文件：" + state.fileName);
        });
      }
      if (!window.__switcherBound) {
        document.querySelectorAll("[data-switch]").forEach(element => {
          element.addEventListener("click", () => cycleVariant(element.dataset.switch === "next" ? 1 : -1));
        });
        window.__switcherBound = true;
      }
    }

    function renderIntake() {
      const sourceName = state.fileName || "orders.sqlite（示例数据）";
      const sourceNote = state.fileName ? "已选择 · 原型只记录文件名" : "3 张表 · 可直接开始演示";
      return `
        <section class="intake">
          <p class="eyebrow">New Investigation / step 1 of 3</p>
          <h1>先告诉 DataDetective，你想调查什么。</h1>
          <p class="subline">用一句业务问题开始。Agent 会先确认指标和数据范围，再决定需要执行哪些只读分析。</p>
          <div class="intake-grid">
            <section class="intake-panel">
              <label class="question-label" for="question-input">你的调查问题</label>
              <textarea id="question-input" class="question-input" aria-label="你的调查问题">${escapeHtml(state.question || defaultQuestion)}</textarea>
              <p class="input-hint">示例：为什么最近 7 天 GMV 下降了？哪些渠道或设备贡献最大？不要只输入“分析一下数据”。</p>
              <p class="question-label" style="margin-bottom:10px">调查数据</p>
              <div class="source-list">
                <div class="source-row"><div class="source-main"><span class="source-icon">DB</span><div><strong>${escapeHtml(sourceName)}</strong><small>${sourceNote}</small></div></div><span class="tag tag-green">read-only</span></div>
                <label class="file-label" for="data-file">＋ 选择 CSV / Excel / SQLite 文件</label>
                <input id="data-file" class="file-input" type="file" accept=".csv,.xlsx,.xls,.sqlite,.db">
              </div>
              <div class="intake-actions"><p class="tiny">下一步先和 Agent 对话确认问题</p><button class="btn btn-primary" data-action="start">提交问题，开始对话 →</button></div>
            </section>
            <aside class="intake-panel">
              <p class="eyebrow">What the Agent will do</p>
              <h2>它不会直接猜答案</h2>
              <ul class="guardrail-list">
                <li>先确认 Metric 定义、时间窗口和数据人口。</li>
                <li>提出多个可证伪的 Hypotheses。</li>
                <li>调用只读 SQL/Python 工具生成 Evidence。</li>
                <li>记录被削弱的解释和仍然未知的部分。</li>
                <li>最后生成可重放的 Investigation Report。</li>
              </ul>
              <div class="uncertainty" style="margin-top:22px"><strong>原型状态：</strong>文件不会上传，点击开始后使用内置示例调查数据展示完整流程。</div>
            </aside>
          </div>
        </section>
      `;
    }

    function sharedHero() {
      const running = state.phase === "running";
      const complete = state.phase === "complete";
      const planReady = state.phase === "plan_review";
      const followUp = state.phase === "follow_up";
      return `
        <div class="hero-row">
          <div>
            <p class="eyebrow">Investigation / DD-1042 / 24 Aug 2026</p>
            <h1>${escapeHtml(state.question || defaultQuestion)}</h1>
            <p class="subline">数据源：orders.sqlite · 3 张表 · 2026-08-18 至 2026-08-24，对比前一周。调查只读执行，所有结论必须引用已执行 Evidence。</p>
          </div>
          <div class="hero-actions">
            <button class="btn btn-secondary" data-action="clarify">⌁ 指标定义${state.clarified ? "已确认" : "待确认"}</button>
            <button class="btn btn-secondary" data-action="reset">↺ 重置</button>
            <button class="btn btn-primary" data-action="${planReady ? "confirm-plan" : "run"}" ${(running || followUp || state.phase === "clarifying") ? "disabled" : ""}>${running ? "◌ 调查中" : followUp ? "◌ 追问中" : planReady ? "✓ 确认计划" : complete ? "✓ 已完成" : state.phase === "clarifying" ? "等待澄清" : "▶ 开始调查"}</button>
          </div>
        </div>
        ${state.clarified ? '<div class="clarify-box"><strong>待用户确认：</strong>本次 Metric 暂按“已支付订单金额（含折扣，不含取消订单）”计算。确认后，Agent 才会把不同表的金额字段纳入同一调查。</div>' : ""}
      `;
    }

    function metricStrip() {
      return `
        <div class="metric-strip">
          <div class="metric-chip"><small>GMV</small><strong class="negative">-18.4%</strong></div>
          <div class="metric-chip"><small>订单数</small><strong class="negative">-11.2%</strong></div>
          <div class="metric-chip"><small>客单价</small><strong class="positive">+3.1%</strong></div>
          <div class="metric-chip"><small>证据状态</small><strong class="neutral">${state.phase === "complete" ? "7 / 7" : "待执行"}</strong></div>
        </div>
      `;
    }

    function stateLine() {
      const states = {
        clarifying: ["○", "等待澄清 · Agent 正在确认指标定义和调查范围"],
        plan_review: ["◌", "计划待确认 · Hypotheses 已生成，确认后开始执行"],
        running: ["◌", "执行中 · 调查图会随着 Hypotheses 和 Evidence 追加而变化"],
        follow_up: ["◌", "追问执行中 · 原调查链路保留，正在追加新的 Evidence 分支"],
        complete: ["✓", "调查完成 · Finding 已绑定 Evidence，可继续追问"],
        ready: ["○", "调查尚未执行 · 先确认 Metric 定义，再让 Agent 选择证据工具"]
      };
      const [icon, text] = states[state.phase] || states.ready;
      return `<div class="state-line ${state.phase}"><span>${icon}</span>${text}</div>`;
    }

    function hypothesisList() {
      return hypothesisData.map(item => `
        <button class="hypothesis-item ${state.selected === item.id ? "selected" : ""}" data-action="hypothesis" data-id="${item.id}">
          <div class="item-top"><span class="hypothesis-id">${item.id}</span><span class="tag tag-${item.color}">${item.status}</span></div>
          <strong>${item.title}</strong>
          <p>${item.detail}</p>
        </button>
      `).join("");
    }

    function evidenceCards() {
      const selected = state.selected;
      return `
        <div class="evidence-stack">
          <article class="evidence-card ${selected === "H2" ? "selected" : ""}">
            <div class="evidence-top"><div style="display:flex;gap:11px"><span class="evidence-index">E1</span><h3>移动端结算漏斗在比较窗口下降 31%</h3></div><span class="tag tag-green">supports H2</span></div>
            <p>orders.sqlite / funnel_daily：移动端 cart → paid 从 42.8% 降至 29.5%，桌面端基本稳定。差异集中在 Android 设备。</p>
            <div class="evidence-footer"><span class="tiny mono">query:funnel_07 · 0.8s · replayable</span><button class="trace-link" data-action="trace">查看 SQL →</button></div>
          </article>
          <article class="evidence-card ${selected === "H1" ? "selected" : ""}">
            <div class="evidence-top"><div style="display:flex;gap:11px"><span class="evidence-index">E2</span><h3>渠道流量不是主要贡献项</h3></div><span class="tag tag-coral">weakens H1</span></div>
            <p>mobile_direct sessions 仅下降 4.2%，不足以解释 18.4% 的 GMV 变化；其余渠道流量合计保持稳定。</p>
            <div class="evidence-footer"><span class="tiny mono">query:channel_delta_03 · 0.6s · replayable</span><button class="trace-link" data-action="trace">查看 SQL →</button></div>
          </article>
          <article class="evidence-card ${selected === "H3" ? "selected" : ""}">
            <div class="evidence-top"><div style="display:flex;gap:11px"><span class="evidence-index">E3</span><h3>客单价上升，排除低价结构主因</h3></div><span class="tag tag-amber">open H3</span></div>
            <p>AOV 从 ¥218 升至 ¥225。低价商品份额虽有变化，但方向与 GMV 下跌不一致，仍需检查商品组合口径。</p>
            <div class="evidence-footer"><span class="tiny mono">query:aov_mix_11 · 0.9s · replayable</span><button class="trace-link" data-action="trace">查看 SQL →</button></div>
          </article>
        </div>
      `;
    }

    function activity() {
      return `<div class="activity"><p class="eyebrow">Trace / live state</p>${state.events.slice(0, 4).map((event, index) => `<div class="activity-row"><time>${String(10 - index).padStart(2, "0")}:2${index}</time><span>${event}</span></div>`).join("")}</div>`;
    }

    function findingPanel() {
      return `
        <section class="panel">
          <div class="panel-head"><h2>Investigation Report</h2><span class="tag tag-green">${state.phase === "complete" ? "draft ready" : "not ready"}</span></div>
          <div class="panel-body">
            <div class="finding"><p><strong>主要发现：</strong>GMV 下跌主要与 Android 移动端支付转化下降有关。</p><p class="tiny">证据：E1 · 贡献关系，不自动等于因果</p></div>
            <div class="finding"><p><strong>被削弱的解释：</strong>渠道流量下降不足以解释整体变化。</p><p class="tiny">证据：E2 · 需要继续检查投放事件日志</p></div>
            <div class="uncertainty"><strong>仍未证明：</strong>当前数据能定位到“结算漏斗”的变化，但不能证明是哪个产品发布或支付服务事件导致了变化。</div>
            ${activity()}
          </div>
        </section>
      `;
    }

    function renderA() {
      return `${sharedHero()}${metricStrip()}${stateLine()}<div class="layout-a"><section class="panel"><div class="panel-head"><h2>Hypotheses</h2><span class="panel-note">3 candidates</span></div><div class="hypothesis-list">${hypothesisList()}</div></section><section class="panel"><div class="panel-head"><h2>Evidence Ledger</h2><span class="panel-note">click a hypothesis to filter</span></div><div class="panel-body">${evidenceCards()}</div></section>${findingPanel()}</div>`;
    }

    function graphStatus(status) {
      const map = { observed: ["tag-blue", "observed"], planned: ["tag-amber", "planned"], testing: ["tag-amber", "running"], running: ["tag-amber", "running"], supported: ["tag-green", "supported"], complete: ["tag-green", "complete"], weakened: ["tag-coral", "weakened"], open: ["tag-amber", "open"], clarifying: ["tag-blue", "clarifying"], plan_review: ["tag-amber", "plan ready"], follow_up: ["tag-amber", "follow-up"] };
      const [color, label] = map[status] || ["tag-blue", status];
      return `<span class="tag ${color}">${label}</span>`;
    }

    function graphNode(node) {
      const selected = state.selected && state.selected.toLowerCase() === node.id.toLowerCase();
      return `<article class="graph-node ${node.kind} ${node.status} ${selected ? "selected" : ""}" style="left:${node.x}px;top:${node.y}px" data-action="${node.kind === "hypothesis" ? "hypothesis" : "trace"}" data-id="${node.id}">
        <div class="graph-node-top"><h3>${escapeHtml(node.label)}</h3>${graphStatus(node.status)}</div>
        <p>${escapeHtml(node.detail)}</p>
        <div class="graph-meta">${escapeHtml(node.meta)}</div>
      </article>`;
    }

    function graphEdge(edge) {
      const from = state.graph.nodes.find(node => node.id === edge.from);
      const to = state.graph.nodes.find(node => node.id === edge.to);
      if (!from || !to) return "";
      const startX = from.x + 245;
      const startY = from.y + 48;
      const endX = to.x;
      const endY = to.y + 48;
      const curve = Math.max(65, Math.abs(endX - startX) * .45);
      const labelX = (startX + endX) / 2;
      const labelY = (startY + endY) / 2 - 6;
      return `<path class="graph-edge ${edge.relation}" marker-end="url(#arrow)" d="M ${startX} ${startY} C ${startX + curve} ${startY}, ${endX - curve} ${endY}, ${endX} ${endY}"></path><text class="graph-edge-label" x="${labelX}" y="${labelY}">${escapeHtml(edge.relation)}</text>`;
    }

    function renderLiveGraph() {
      const nodes = state.graph.nodes;
      return `<div class="graph-viewport" id="graph-viewport"><div class="graph-world" id="graph-world"><svg class="graph-edges" viewBox="0 0 1380 980" aria-hidden="true"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5" viewBox="0 0 7 7"><path d="M 0 0 L 7 3.5 L 0 7 z" fill="#849691"></path></marker></defs>${state.graph.edges.map(graphEdge).join("")}</svg>${nodes.map(graphNode).join("")}</div><div class="graph-empty" style="bottom:14px;left:14px;position:absolute;right:14px;z-index:4">拖动画布查看不同调查树 · 点击节点查看详情 · 滚轮缩放</div></div>`;
    }

    function bindGraphCanvas() {
      const viewport = document.getElementById("graph-viewport");
      const world = document.getElementById("graph-world");
      if (!viewport || !world) return;
      const applyTransform = () => { world.style.transform = `translate(${state.view.x}px, ${state.view.y}px) scale(${state.view.scale})`; };
      applyTransform();
      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      viewport.addEventListener("pointerdown", event => {
        if (event.target.closest(".graph-node") || event.target.closest("button")) return;
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        viewport.classList.add("is-panning");
        viewport.setPointerCapture(event.pointerId);
      });
      viewport.addEventListener("pointermove", event => {
        if (!dragging) return;
        state.view.x += event.clientX - lastX;
        state.view.y += event.clientY - lastY;
        lastX = event.clientX;
        lastY = event.clientY;
        applyTransform();
      });
      const stopPanning = event => {
        if (!dragging) return;
        dragging = false;
        viewport.classList.remove("is-panning");
        viewport.releasePointerCapture?.(event.pointerId);
      };
      viewport.addEventListener("pointerup", stopPanning);
      viewport.addEventListener("pointercancel", stopPanning);
      viewport.addEventListener("wheel", event => {
        event.preventDefault();
        state.view.scale = Math.min(1.35, Math.max(.45, state.view.scale + (event.deltaY > 0 ? -.06 : .06)));
        applyTransform();
      }, { passive: false });
    }

    function renderChatPanel() {
      const suggestions = state.phase === "clarifying" ? `<button class="suggestion" data-action="suggestion" data-id="GMV = 已支付订单金额；排除取消订单；对比前 7 天">确认：已支付金额，排除取消订单，对比前 7 天</button>` : state.phase === "plan_review" ? `<button class="btn btn-primary" data-action="confirm-plan" style="width:100%">✓ 确认计划，开始调查</button>` : state.phase === "complete" ? `<button class="suggestion" data-action="suggestion" data-id="只看 Android 端，并检查支付失败原因">只看 Android，并检查支付失败原因</button><button class="suggestion" data-action="suggestion" data-id="为什么不是渠道流量？">为什么不是渠道流量？</button>` : `<span class="tiny">调查事件会实时写入中央画布</span>`;
      return `<section class="panel chat-panel"><div class="panel-head"><div><p class="eyebrow" style="margin-bottom:4px">Chat-first investigation</p><h2>和 Agent 一起调查</h2></div>${graphStatus(state.phase === "follow_up" ? "running" : state.phase)}</div><div class="chat-thread">${state.messages.map(message => `<div class="chat-message ${message.role}"><span class="chat-avatar">${message.role === "user" ? "你" : "AI"}</span><div class="chat-bubble"><strong>${message.role === "user" ? "User" : "Agent"}</strong>${escapeHtml(message.text).replace(/\n/g, "<br>")}</div></div>`).join("")}</div><div class="chat-suggestions">${suggestions}</div><div class="chat-compose"><textarea id="chat-input" aria-label="继续追问" placeholder="继续追问，例如：只看 Android 端，或补充指标定义"></textarea><div class="chat-compose-footer"><span class="tiny">追问会保留原证据，追加新分支</span><button class="btn btn-secondary" data-action="send-chat">发送 ↗</button></div></div></section>`;
    }

    function renderGraphDetail() {
      const selectedId = state.selected && state.selected.toLowerCase();
      const selected = state.graph.nodes.find(node => node.id.toLowerCase() === selectedId) || state.graph.nodes[state.graph.nodes.length - 1];
      return `<section class="panel graph-detail"><div class="panel-head"><h2>Current node</h2><span class="panel-note">live state</span></div><div class="detail-stack"><div class="detail-block"><small>Selected</small><strong>${escapeHtml(selected?.label || "等待调查")}</strong><p>${escapeHtml(selected?.detail || "先在聊天区确认问题和调查计划。")}</p></div><div class="detail-block"><small>Status</small>${selected ? graphStatus(selected.status) : ""}<p>${escapeHtml(selected?.meta || "no evidence yet")}</p></div><div class="detail-block"><small>Investigation contract</small><strong>每个 Finding 都必须链接到已执行 Evidence</strong><p>当前画布只展示可验证状态，不展示模型内部思考。</p></div><div class="detail-block"><small>Next move</small><strong>${state.phase === "clarifying" ? "回答 Agent 的澄清问题" : state.phase === "plan_review" ? "确认调查计划" : state.phase === "running" ? "等待 Evidence 追加" : "继续追问或补充数据"}</strong></div></div></section>`;
    }

    function renderB() {
      return `${sharedHero()}${metricStrip()}${stateLine()}<div class="b-workspace">${renderChatPanel()}<section class="panel live-graph-panel"><div class="canvas-head"><div><p class="eyebrow">Live Investigation Canvas</p><h2>多棵调查树 / 关系画布</h2></div><div class="canvas-tools"><button class="canvas-tool" data-action="zoom-out" title="Zoom out" aria-label="Zoom out">−</button><button class="canvas-tool" data-action="fit-graph" title="Reset view" aria-label="Reset view">⌂</button><button class="canvas-tool" data-action="zoom-in" title="Zoom in" aria-label="Zoom in">＋</button><span class="tag tag-blue">event-driven</span></div></div>${renderLiveGraph()}</section>${renderGraphDetail()}</div>`;
    }

    function renderC() {
      return `${sharedHero()}${metricStrip()}${stateLine()}<div class="layout-c"><article class="panel brief"><div class="brief-kicker"><span class="tag tag-green">Investigation Report / draft</span><span class="tiny">last updated 10:24</span></div><p class="eyebrow">Executive finding</p><h1>GMV 下降的主要贡献来自 Android 端结算转化。</h1><p class="brief-lead">移动端 cart → paid 在比较窗口下降 31%，而桌面端稳定。渠道流量和客单价的变化方向与主因不符。</p><hr class="brief-rule"><section class="brief-section"><h2><span class="number">01</span> Hypothesis ranking</h2><p class="tiny">排序反映当前证据支持度，不代表已证明因果。</p><div class="hypothesis-table">${hypothesisData.map(item => `<div class="hypothesis-line" data-action="hypothesis" data-id="${item.id}"><span class="rank">${item.id}</span><strong>${item.title}</strong><span class="bar"><i style="width:${item.confidence}%"></i></span><span class="confidence">${item.confidence}%</span></div>`).join("")}</div></section><hr class="brief-rule"><div class="brief-footer"><section class="brief-section"><h2><span class="number">02</span> What the data supports</h2><div class="proof-box"><strong>Finding F1 · supported by E1</strong><p>Android checkout completion is the strongest observed contribution to the GMV movement. Query and input snapshot are replayable.</p></div></section><section class="brief-section"><h2><span class="number">03</span> What remains unknown</h2><div class="proof-box" style="border-color:var(--amber);background:var(--amber-soft)"><strong>Do not overclaim causality</strong><p>The current exports cannot identify the product release, payment incident, or user behavior change behind the funnel movement.</p></div></section></div></article><aside class="sidebar-c"><section class="panel"><div class="panel-head"><h2>Metric contract</h2><span class="tag tag-blue">confirmed</span></div><div class="panel-body"><div class="fact-list"><div class="fact"><small>Definition</small><strong>Paid order amount, after discount</strong></div><div class="fact"><small>Population</small><strong>Non-cancelled orders</strong></div><div class="fact"><small>Window</small><strong>18 Aug → 24 Aug 2026</strong><p>Compared with 11 Aug → 17 Aug 2026</p></div></div></div></section><section class="panel"><div class="panel-head"><h2>Next evidence</h2><span class="panel-note">human input</span></div><div class="panel-body"><p class="tiny">To explain the underlying cause, connect one of these sources:</p><div class="decision-list"><div class="decision-row"><span class="decision-icon open">+</span><div><strong>支付服务事件日志</strong><p>Check Android payment failures by release.</p></div></div><div class="decision-row"><span class="decision-icon open">+</span><div><strong>版本发布记录</strong><p>Compare checkout changes in the same window.</p></div></div></div><button class="btn btn-secondary" style="margin-top:14px;width:100%" data-action="clarify">⌁ 补充数据后继续</button></div></section>${activity()}</aside></div>`;
    }

    function render() {
      const variant = currentVariant();
      const active = variants.find(item => item.key === variant);
      document.getElementById("variant-key").textContent = active.key;
      document.getElementById("variant-name").textContent = active.name;
      document.querySelector(".switcher").style.display = state.screen === "intake" ? "none" : "flex";
      document.getElementById("app").innerHTML = state.screen === "intake" ? renderIntake() : variant === "A" ? renderA() : variant === "B" ? renderB() : renderC();
      bindActions();
      bindGraphCanvas();
    }

    document.addEventListener("keydown", event => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });

    render();
  </script>
</body>
</html>
